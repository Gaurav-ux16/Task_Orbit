# ============================================================
# TaskOrbit — Spring Boot Academic Reporting Service Properties
# Port 8081: Isolated from Express API (3001) & React (5173)
# ============================================================

server.port=8081
server.servlet.context-path=/

# ── Primary Educational Database (In-Memory H2) ─────────────
spring.datasource.url=jdbc:h2:mem:taskorbit_reporting_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Optional MySQL Production Connection (Documented in Syllabus)
# spring.datasource.url=jdbc:mysql://localhost:3306/taskorbit_reporting_db?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate Settings ─────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Actuator Monitoring Endpoints ───────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Spring Security Demo Credentials ─────────────────────────
spring.security.user.name=manager
spring.security.user.password=manager123
spring.security.user.roles=PROJECT_MANAGER

# Application Metadata
info.app.name=TaskOrbit Spring Boot Reporting Service
info.app.version=1.0.0
info.app.syllabus-unit=Unit IV (Spring Framework & Spring Boot)
